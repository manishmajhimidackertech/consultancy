<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate CV | {{COMPANY_NAME}}</title>

    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/dialog.css" />
    <script src="../../assets/js/defaultDialog.js"></script>
    <script src="../../assets/js/toastDialog.js"></script>

    <link rel="stylesheet" href="../../admin/style/admin.css" />
    <link rel="stylesheet" href="../../admin/style/notifications.css" />
    <script src="../../admin/script/admin.js"></script>
    <script src="../../admin/script/notifications.js"></script>

    <link rel="stylesheet" href="../style/gen.css" />
    <script src="../script/fetchClient.js"></script>
    <script src="../script/paper.js"></script>
    <script src="../script/printDocument.js"></script>

    <link rel="stylesheet" href="./cv.css" />
    <script src="./cv.js"></script>
    <script src="./entryRows.js"></script>
    <script src="./renderCV.js"></script>
  </head>
  <body>
    <aside>{{ASIDE_CONTENTS}}</aside>
    <main>
      <header>{{HEADER_CONTENTS}}</header>
      <section id="generator">
        <form id="editor" autocomplete="off">
          <section class="editor_group">
            <h2 id="personal_details_heading">Personal Details</h2>
            <fieldset aria-labelledby="personal_details_heading">
              <label>
                Full Name
                <input type="text" name="name" />
              </label>
              <label>
                Address
                <input type="text" name="address" />
              </label>
              <div class="pair">
                <label>
                  Mobile Number
                  <input type="text" name="mobileNumber" />
                </label>
                <label>
                  Email
                  <input type="email" name="email" />
                </label>
              </div>
              <div class="pair">
                <label>
                  Gender
                  <select name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Prefer Not Say">Prefer Not Say</option>
                  </select>
                </label>
                <label>
                  Date of Birth
                  <input type="date" name="dateOfBirth" />
                </label>
              </div>
              <div class="pair">
                <label>
                  Nationality
                  <input type="text" name="nationality" value="Nepali" />
                </label>
                <label>
                  Bike License
                  <select name="bikeLicense">
                    <option value="no">Not Obtained</option>
                    <option value="yes">Obtained</option>
                  </select>
                </label>
              </div>
              <label class="inline">
                <input type="checkbox" name="showPhoto" checked />
                Show the profile picture
              </label>
            </fieldset>
          </section>

          <section class="editor_group">
            <h2 id="career_objective_heading">Career Objective</h2>
            <fieldset aria-labelledby="career_objective_heading">
              <label class="wide">
                Positions Sought
                <input
                  type="text"
                  name="positions"
                  placeholder="separate them with commas"
                />
              </label>
              <label>
                Objective
                <textarea name="objective" rows="3"></textarea>
              </label>
              <p class="hint">
                Written from the positions until you change it yourself.
              </p>
            </fieldset>
          </section>

          <section class="editor_group">
            <h2 id="education_heading">Education</h2>
            <fieldset aria-labelledby="education_heading">
              <div class="entry_rows" id="education">
                <!-- Rows are added by entryRows.js -->
              </div>
              <div class="entry_controls">
                <button
                  type="button"
                  class="green_button transparent_button"
                  onclick="addEntryRow('education', true)"
                >
                  Add
                </button>
                <button
                  type="button"
                  class="red_button transparent_button"
                  id="education_remove"
                  onclick="removeEntryRow('education')"
                >
                  Remove
                </button>
              </div>
            </fieldset>
          </section>

          <section class="editor_group">
            <h2 id="work_experience_heading">Work Experience</h2>
            <fieldset aria-labelledby="work_experience_heading">
              <div class="entry_rows" id="experience">
                <!-- Rows are added by entryRows.js -->
              </div>
              <div class="entry_controls">
                <button
                  type="button"
                  class="green_button transparent_button"
                  onclick="addEntryRow('experience', true)"
                >
                  Add
                </button>
                <button
                  type="button"
                  class="red_button transparent_button"
                  id="experience_remove"
                  onclick="removeEntryRow('experience')"
                >
                  Remove
                </button>
              </div>
            </fieldset>
          </section>

          <section class="editor_group">
            <h2 id="skills_and_languages_heading">Skills &amp; Languages</h2>
            <fieldset aria-labelledby="skills_and_languages_heading">
              <label>
                Skills
                <input
                  type="text"
                  name="skills"
                  placeholder="separate them with commas"
                />
              </label>
              <label>
                Languages
                <input type="text" name="languages" value="Nepali, English" />
              </label>
            </fieldset>
          </section>

          <section class="editor_group">
            <h2 id="declaration_heading">Declaration</h2>
            <fieldset aria-labelledby="declaration_heading">
              <div class="pair">
                <label>
                  Place
                  <input type="text" name="place" />
                </label>
                <label>
                  Date
                  <input type="date" name="signedOn" />
                </label>
              </div>
            </fieldset>
          </section>

          <section id="actions">
            <p class="hint">
              Empty fields are left out of the CV, except place and date, which
              print as a line to fill in by hand.
            </p>
            <div class="action_buttons">
              <button
                type="button"
                onclick="backToClients()"
                class="positive_button transparent_button"
              >
                Back
              </button>
              <button
                type="button"
                onclick="previewCV()"
                class="negative_button confirm_button"
              >
                Preview
              </button>
            </div>
          </section>
        </form>

        <!-- Drawn as the editor changes; seen through Preview, and printed. -->
        <section id="preview">
          <article id="paper" class="paper cv"></article>
        </section>
      </section>
    </main>
  </body>
</html>
